<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>✜ClinicApp</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="./icons/icon-192.png"
>
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"
>
    <meta name="theme-color" content="#3f6f91">

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="topbar">

    <div class="logo">
            ✜ ClinicApp
    </div>

    <div class="topbar-right">
        <div class="today" id="today">
    </div>
        <button id="doctorProfileButton" class="doctor-profile-button" type="button">
            <span id="doctorProfileName">Cargando perfil...</span>
            <small id="doctorProfileSpecialty"></small>
        </button>
        <button id="logoutButton" class="logout-button">Cerrar sesión
        </button>
    </div>

    </header>


    <!-- BUSCADOR -->

    <section class="searchBar">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Buscar paciente por nombre, apellido, DNI, Obra social, Nº Afiliado, Teléfono o Email">

    </section>


    <!-- CONTENIDO -->

    <main class="content">

        <!-- LISTADO -->

        <aside class="sidebar">

            <div class="sidebar-title">

                Pacientes

            </div>

            <div
                id="results"
                class="results">

            </div>

            <div class="patient-list-footer">

                <button id="togglePatientListButton" class="patient-list-toggle" type="button">
                    Ver todos los pacientes

                </button>
            </div>

        </aside>


        <!-- PANEL -->

        <section
            id="patientPanel"
            class="patientPanel">

            <div class="empty">

                <h2>Bienvenido</h2>

                <br>

                Seleccioná un paciente desde la izquierda.

            </div>

        </section>

    </main>


    <!-- BOTON -->

    <button
        id="newPatientButton"
        class="floating-button">

        +

    </button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="components/modal.js"></script>

<script src="database.js"></script>

<script src="app.js"></script>

<script>
    if("serviceWorker" in navigator){

        window.addEventListener("load", async () => {

            try{

                const registro =
                    await navigator.serviceWorker.register(
                        "./service-worker.js"
                    );

                console.log(
                    "Service Worker activo:",
                    registro.scope
                );

            }catch(error){

                console.error(
                    "Error al registrar Service Worker:",
                    error
                );

            }

        });

    }
</script>

</body>

</html>
